<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tiempo al trabajo</title>
<link rel="stylesheet" href="options.css">
<link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <h1 data-i18n="actionTitle"></h1>
  <p class="state" id="state" role="status"></p>
  <form id="form" hidden>
    <label class="field"><span data-i18n="passphrase"></span><input id="passphrase" type="password" autocomplete="off"></label>
    <button id="unlock" type="submit" class="primary" data-i18n="unlock"></button>
  </form>
  <button id="lock" type="button" class="btn" data-i18n="lockNow" hidden></button>
  <p class="err" id="err" role="alert"></p>
  <a href="#" id="options" data-i18n="openOptions"></a>
  <script type="module" src="popup.js"></script>
</body>
</html>
