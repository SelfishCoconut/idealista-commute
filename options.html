<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opciones</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <h1 data-i18n="actionTitle"></h1>
  <p class="sub" data-i18n="optSub"></p>

  <form id="gate" hidden>
    <h2 data-i18n="optLockedTitle"></h2>
    <p class="hint" data-i18n="optLockedHint"></p>
    <label class="field"><span data-i18n="passphrase"></span><input id="gatePass" type="password" autocomplete="off"></label>
    <div class="test"><button type="submit" class="primary" data-i18n="unlock"></button><span class="msg" id="gateErr" role="alert"></span></div>
  </form>

  <div id="app">
  <div class="preview" data-i18n-aria-label="previewLabel">
    <div class="row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/><path d="M4 11h16"/><path d="M8 21l2-3M16 21l-2-3"/></svg>
      <strong>28 min</strong><span class="meta" data-i18n="changeOne"></span>
      <span class="ai"><strong>12%</strong> <span class="meta" data-i18n="aiShort"></span></span>
    </div>
    <p class="cap" id="previewCap" data-i18n="previewCap"></p>
  </div>

  <section>
    <h2 data-i18n="secCommute"></h2>
    <label class="field"><span data-i18n="workAddress"></span>
      <input id="workAddress" placeholder="Paseo de la Castellana 100, Madrid" autocomplete="off">
    </label>
    <div class="grid">
      <label class="field"><span data-i18n="arriveBy"></span>
        <input id="arriveBy" type="time" value="09:00">
        <p class="hint" data-i18n="arriveByHint"></p>
      </label>
      <label class="field"><span data-i18n="city"></span>
        <input id="citySuffix" placeholder="Madrid, España" autocomplete="off">
        <p class="hint" data-i18n="cityHint"></p>
      </label>
    </div>
    <label class="switch"><input id="pinFromMap" type="checkbox">
      <span><b data-i18n="pinTitle"></b><p class="hint" data-i18n="pinHint"></p></span>
    </label>
  </section>

  <section>
    <h2 data-i18n="secWhere"></h2>
    <div class="seg" role="radiogroup" data-i18n-aria-label="backendAria">
      <label class="opt"><input type="radio" name="backend" value="server" checked><span data-i18n="optServer"></span></label>
      <label class="opt"><input type="radio" name="backend" value="browser"><span data-i18n="optBrowser"></span></label>
    </div>
    <div class="panel" id="serverPanel">
    <p class="hint" id="serverWhy" data-i18n="serverWhy" hidden style="margin:16px 0 0"></p>
    <label class="field"><span data-i18n="serverUrl"></span>
      <input id="serverUrl" class="mono" placeholder="http://127.0.0.1:8085" autocomplete="off" spellcheck="false">
      <p class="hint" data-i18n="serverUrlHint"></p>
    </label>
    <label class="field"><span data-i18n="accessToken"></span>
      <input id="accessToken" class="mono" type="password" autocomplete="off">
      <p class="hint" data-i18n="accessTokenHint"></p>
    </label>
    <div class="test"><button id="test" type="button" class="btn" data-i18n="testServer"></button><span class="dot" id="testDot"></span><span class="msg" id="testResult"></span></div>
    </div>
    <div class="panel" id="browserPanel" hidden>
      <div class="grid">
        <label class="field"><span data-i18n="googleKey"></span><input id="googleKey" class="mono" type="password" autocomplete="off"></label>
        <label class="field"><span data-i18n="routesMonth"></span><input id="googleLimit" type="number" min="1" value="2000"></label>
      </div>
      <label class="field"><span><span data-i18n="tileUrl"></span> <small data-i18n="optional"></small></span><input id="tileUrl" class="mono" placeholder="https://tile.openstreetmap.org/{z}/{x}/{y}.png" autocomplete="off" spellcheck="false">
        <p class="hint" data-i18n="tileUrlHint"></p></label>
      <div class="note" data-i18n="browserNote"></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="secPhoto"></h2>
    <div class="seg" role="radiogroup" data-i18n-aria-label="photoAria">
      <label class="opt"><input type="radio" name="aiSource" value="server" checked><span data-i18n="optServer"></span></label>
      <label class="opt"><input type="radio" name="aiSource" value="browser"><span data-i18n="optMyKey"></span></label>
    </div>
    <p class="hint" id="aiServerHint" data-i18n="aiServerHint" style="margin-top:12px"></p>
    <div class="panel" id="aiKeyPanel" hidden>
      <div class="grid">
        <label class="field"><span data-i18n="apiUser"></span><input id="sightengineUser" class="mono" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span data-i18n="apiSecret"></span><input id="sightengineSecret" class="mono" type="password" autocomplete="off"></label>
      </div>
      <label class="field"><span data-i18n="photosMonth"></span><input id="sightengineLimit" type="number" min="1" value="1500"></label>
      <div class="note" data-i18n="sightNote"><a href="https://sightengine.com" target="_blank" rel="noopener noreferrer">Sightengine</a></div>
    </div>
  </section>

  <section id="vaultSection">
    <h2 data-i18n="secVault"></h2>
    <label class="field"><span data-i18n="passphrase"></span><input id="passphrase" type="password" autocomplete="off"></label>
    <p class="hint" id="vaultHint"></p>
  </section>

  <section>
    <h2 data-i18n="secData"></h2>
    <dl class="stats" id="usage"></dl>
    <button id="clear" type="button" class="btn" data-i18n="clearCache"></button>
  </section>
  </div>
</main>

<div class="bar" id="bar"><div><span id="status" role="status"></span><button id="save" type="button" class="primary" data-i18n="save"></button></div></div>
<script type="module" src="options.js"></script>
</body>
</html>
